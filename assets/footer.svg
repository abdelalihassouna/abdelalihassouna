<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="1200" height="90" role="img" aria-label="Let's build what's next">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#081629"/>
      <stop offset="1" stop-color="#0C2547"/>
    </linearGradient>
    <pattern id="minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#6FA8FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="90" rx="14"/></clipPath>
    <style>
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .link{stroke:#FFB547;stroke-width:1.3;stroke-dasharray:3 7;animation:flow 1.6s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-20}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="90" fill="url(#bg)"/>
    <rect width="1200" height="90" fill="url(#minor)"/>
    <g stroke="#FFB547" stroke-width="2" fill="none">
      <path d="M20 36V20H36"/><path d="M1164 20H1180V36"/><path d="M20 54V70H36"/><path d="M1164 70H1180V54"/>
    </g>
    <line x1="70" y1="45" x2="330" y2="45" class="link"/>
    <line x1="870" y1="45" x2="1130" y2="45" class="link"/>
    <circle cx="330" cy="45" r="4" fill="#FFB547"/><circle cx="870" cy="45" r="4" fill="#FFB547"/>
    <text x="600" y="51" text-anchor="middle" class="mono" font-size="17" letter-spacing="2" fill="#DCE8FA">LET'S BUILD WHAT'S NEXT <tspan fill="#FFB547">→</tspan></text>
  </g>
</svg>
